version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
      i18n-ecosystem:
        patterns:
          - "i18next*"
          - "react-i18next"
    ignore:
      # 忽略 Tailwind CSS v4 大版本更新（保留使用稳定成熟的 Tailwind v3）
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # 忽略 TypeScript 跨大版本更新（当前已升级至 v7）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 保持 Node 类型定义与当前环境（Node 24）一致
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencies
